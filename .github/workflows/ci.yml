name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Type-check, build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend type-check and build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Versions agree
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if ($conf -ne $pkg -or $conf -ne $cargo) { throw "Version mismatch: keep package.json and Cargo.toml equal to tauri.conf.json" }

  release:
    name: Build installer and draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tag matches tauri.conf.json version
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($conf -ne $tag) { throw "Tag v$tag does not match tauri.conf.json version $conf" }

      # Code signing (issue #1). With Azure Trusted Signing, add a step here that installs
      # the signing tools and set bundle.windows.signCommand in tauri.conf.json, for example:
      #   - uses: azure/trusted-signing-action@v0
      # The exe and the NSIS installer are then signed during `tauri build`.

      - name: Build installer and upload to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: IVAR glTF Viewer ${{ github.ref_name }}
          releaseBody: See the commit history for changes. SHA-256 checksums are in SHA256SUMS.txt.
          releaseDraft: true
          prerelease: false

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
