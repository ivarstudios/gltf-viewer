name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# One run per ref at a time: two quick tag pushes must not race on the same draft release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commits (Dependabot keeps them current); the comment is the tag.
jobs:
  check:
    name: Type-check, build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend type-check and build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Versions agree
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json).packages[0].version
          "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if ($conf -ne $pkg -or $conf -ne $cargo) { throw "Version mismatch: keep package.json and Cargo.toml equal to tauri.conf.json" }

  release:
    name: Build installer and draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tag matches tauri.conf.json version
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($conf -ne $tag) { throw "Tag v$tag does not match tauri.conf.json version $conf" }

      # Code signing (issue #1). With Azure Trusted Signing, add a step here that installs
      # the signing tools and set bundle.windows.signCommand in tauri.conf.json, for example:
      #   - uses: azure/trusted-signing-action@v0
      # The exe and the NSIS installer are then signed during `tauri build`.

      - name: Build installer
        run: npm run tauri build

      - name: Draft release with checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer found under src-tauri/target/release/bundle/nsis" }
          # GitHub replaces spaces in asset names with dots, which would make the checksum
          # file name a file that does not exist; publish a name without spaces instead.
          $name = $exe.Name -replace ' ', '-'
          $out = Join-Path $PWD release
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item $exe.FullName (Join-Path $out $name)
          $hash = (Get-FileHash (Join-Path $out $name) -Algorithm SHA256).Hash.ToLower()
          # Two spaces and LF line endings: the format `sha256sum -c` and `shasum -c` accept.
          [IO.File]::WriteAllText((Join-Path $out SHA256SUMS.txt), "$hash  $name`n")
          Get-Content (Join-Path $out SHA256SUMS.txt)
          gh release create "${{ github.ref_name }}" (Join-Path $out $name) (Join-Path $out SHA256SUMS.txt) `
            --draft --verify-tag `
            --title "IVAR glTF Viewer ${{ github.ref_name }}" `
            --notes "See the commit history for changes. SHA-256 checksums are in SHA256SUMS.txt."
